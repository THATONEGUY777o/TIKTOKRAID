<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Lives TikTok</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        /* Caixa de Debug para ver o erro no celular */
        #debugBox {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: rgba(255, 0, 0, 0.9);
            color: white;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            z-index: 10000;
            max-height: 150px;
            overflow-y: auto;
            box-sizing: border-box;
        }
        #splashScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        #enterBtn {
            background-color: #fe2c55;
            color: white;
            font-size: 22px;
            font-weight: bold;
            padding: 20px 40px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(254, 44, 85, 0.6);
        }
        #mainContent {
            display: none;
            width: 100%;
            max-width: 500px;
        }
        .container {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            width: 100%;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        input, .panel-btn {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
        }
        input {
            background-color: #333;
            color: white;
            box-sizing: border-box;
        }
        .panel-btn {
            background-color: #fe2c55;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
    <script>
        // Captura erros globais antes de carregar o resto da página
        window.onerror = function(message, source, lineno, colno, error) {
            const debugBox = document.getElementById('debugBox');
            if (debugBox) {
                debugBox.innerHTML += `<div>❌ ERRO: ${message} (Linha: ${lineno})</div>`;
            }
            return false;
        };
    </script>
</head>
<body>

    <!-- Caixa de Debug Visual -->
    <div id="debugBox">🟢 Monitor de Erros Ativo... <br></div>

    <div id="splashScreen">
        <button id="enterBtn">ENTRAR NO SITE</button>
    </div>

    <audio id="bgMusic" loop preload="auto">
        <source src="https://githubusercontent.com" type="audio/mpeg">
    </audio>

    <div id="mainContent">
        <div class="container">
            <h2>Anunciar Live do TikTok</h2>
            <input type="text" id="tiktokInput" placeholder="Ex: @nome_do_criador">
            <input type="text" id="validationCodeInput" placeholder="Digite o Código aqui">
            <button class="panel-btn" id="startBtn">Anunciar Live</button>
        </div>
        <div class="container" id="containerLives" style="display: none;">
            <h3>Lives Anunciadas</h3>
            <div id="listaLives"></div>
        </div>
    </div>

    <!-- Scripts externos -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <script>
        // Adiciona um log simples para ver se o script foi lido pelo celular
        document.getElementById('debugBox').innerHTML += "<div>Script local lido...</div>";

        try {
            const firebaseConfig = {
                apiKey: "AIzaSyAWcHshhQWnGPIOBPRe__UyS4B9QKw3Jg8",
                authDomain: "://firebaseapp.com",
                databaseURL: "https://firebaseio.com",
                projectId: "tiktokliveanunciamento",
                storageBucket: "tiktokliveanunciamento.firebasestorage.app",
                messagingSenderId: "565264297620",
                appId: "1:565264297620:web:765ec6e871e5fa7de84e81"
            };

            firebase.initializeApp(firebaseConfig);
            document.getElementById('debugBox').innerHTML += "<div>Firebase Conectado!</div>";

            const splashScreen = document.getElementById('splashScreen');
            const enterBtn = document.getElementById('enterBtn');
            const mainContent = document.getElementById('mainContent');
            const bgMusic = document.getElementById('bgMusic');

            enterBtn.addEventListener('click', () => {
                document.getElementById('debugBox').innerHTML += "<div>Botão clicado! Tentando abrir...</div>";
                bgMusic.play().catch(e => {
                    document.getElementById('debugBox').innerHTML += `<div>Aviso Música: ${e.message}</div>`;
                });
                splashScreen.style.opacity = '0';
                setTimeout(() => {
                    splashScreen.style.display = 'none';
                    mainContent.style.display = 'block';
                }, 500);
            });

        } catch (err) {
            document.getElementById('debugBox').innerHTML += `<div>❌ Erro no Bloco Principal: ${err.message}</div>`;
        }
    </script>
</body>
</html>
