<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Lives TikTok</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        #splashScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        #enterBtn {
            background-color: #fe2c55;
            color: white;
            font-size: 22px;
            font-weight: bold;
            padding: 20px 40px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(254, 44, 85, 0.6);
        }
        #mainContent {
            display: none;
            width: 100%;
            max-width: 500px;
        }
        .container {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            width: 100%;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        input, .panel-btn {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
        }
        input {
            background-color: #333;
            color: white;
            box-sizing: border-box;
        }
        .panel-btn {
            background-color: #fe2c55;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .live-item {
            background-color: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-left: 5px solid #fe2c55;
        }
        .live-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid #fe2c55;
        }
        .timer-display {
            font-weight: bold;
            color: #fe2c55;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <!-- 1. TELA DE ENTRADA -->
    <div id="splashScreen">
        <button id="enterBtn">ENTRAR NO SITE</button>
    </div>

    <!-- ÁUDIO DE FUNDO -->
    <audio id="bgMusic" loop preload="auto">
        <source src="https://githubusercontent.com" type="audio/mpeg">
    </audio>

    <!-- 2. CONTEÚDO PRINCIPAL -->
    <div id="mainContent">
        <div class="container">
            <h2>Anunciar Live do TikTok</h2>
            <p>Insira os dados e o código de uso único gerado pelo dono:</p>
            <input type="text" id="tiktokInput" placeholder="Ex: @nome_do_criador">
            <input type="text" id="validationCodeInput" placeholder="Digite o Código de Validação aqui">
            <button class="panel-btn" id="startBtn">Anunciar Live</button>
        </div>

        <div class="container" id="containerLives" style="display: none;">
            <h3>Lives Anunciadas</h3>
            <div id="listaLives"></div>
        </div>
    </div>

    <!-- SCRIPTS DO FIREBASE COM CARREGAMENTO GARANTIDO -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <script>
        // Função de segurança para garantir que o Firebase carregou antes de rodar o app
        function iniciarAplicativo() {
            if (typeof firebase === 'undefined') {
                // Se falhar, tenta recarregar o script após 1 segundo
                setTimeout(iniciarAplicativo, 1000);
                return;
            }

            const firebaseConfig = {
                apiKey: "AIzaSyAWcHshhQWnGPIOBPRe__UyS4B9QKw3Jg8",
                authDomain: "://firebaseapp.com",
                databaseURL: "https://firebaseio.com",
                projectId: "tiktokliveanunciamento",
                storageBucket: "tiktokliveanunciamento.firebasestorage.app",
                messagingSenderId: "565264297620",
                appId: "1:565264297620:web:765ec6e871e5fa7de84e81"
            };

            firebase.initializeApp(firebaseConfig);
            const database = firebase.database();

            const splashScreen = document.getElementById('splashScreen');
            const enterBtn = document.getElementById('enterBtn');
            const mainContent = document.getElementById('mainContent');
            const bgMusic = document.getElementById('bgMusic');

            enterBtn.addEventListener('click', () => {
                bgMusic.play().catch(error => console.log("Música travada:", error));
                splashScreen.style.opacity = '0';
                setTimeout(() => {
                    splashScreen.style.display = 'none';
                    mainContent.style.display = 'block';
                }, 500);
            });

            const startBtn = document.getElementById('startBtn');
            const listaLives = document.getElementById('listaLives');
            const containerLives = document.getElementById('containerLives');

            startBtn.addEventListener('click', () => {
                const inputVal = document.getElementById('tiktokInput').value.trim();
                const codigoDigitado = document.getElementById('validationCodeInput').value.trim().toUpperCase();

                if (!inputVal) return alert('Por favor, insira o criador da live.');
                if (!codigoDigitado) return alert('Por favor, insira o código de validação.');

                database.ref('codigos_gerados').once('value', (snapshot) => {
                    let codigoValido = false;
                    let chaveDoCodigo = null;

                    if (snapshot.exists()) {
                        const dados = snapshot.val();
                        for (let id in dados) {
                            if (dados[id].codigo === codigoDigitado) {
                                codigoValido = true;
                                chaveDoCodigo = id;
                                break;
                            }
                        }
                    }

                    if (codigoValido && chaveDoCodigo) {
                        database.ref('codigos_gerados/' + chaveDoCodigo).remove();
                        containerLives.style.display = 'block';

                        let username = inputVal;
                        if (!username.startsWith('@')) {
                            username = '@' + username;
                        }

                        const liveCard = document.createElement('div');
                        liveCard.className = 'live-item';
                        const timerId = 'timer_' + Date.now();

                        liveCard.innerHTML = `
                            <div class="live-info">
                                <img class="avatar" src="https://picsum.photos" alt="Avatar">
                                <div>
                                    <strong>Live Ativa</strong><br>
                                    <span class="user-text"></span>
                                </div>
                            </div>
                            <div class="timer-display" id="${timerId}">02:00</div>
                        `;

                        liveCard.querySelector('.user-text').textContent = username;
                        listaLives.appendChild(liveCard);

                        document.getElementById('tiktokInput').value = '';
                        document.getElementById('validationCodeInput').value = '';

                        let tempoRestante = 120;
                        const liveCountdown = setInterval(() => {
                            tempoRestante--;
                            let minutos = Math.floor(tempoRestante / 60);
                            let segundos = tempoRestante % 60;
                            segundos = segundos < 10 ? '0' + segundos : segundos;
                            minutos = minutos < 10 ? '0' + minutos : minutos;

                            const timerElement = document.getElementById(timerId);
                            if (timerElement) {
                                timerElement.innerText = minutos + ':' + segundos;
                            }

                            if (tempoRestante <= 0) {
                                clearInterval(liveCountdown);
                                liveCard.remove();
                                if (listaLives.children.length === 0) {
                                    containerLives.style.display = 'none';
                                }
                            }
                        }, 1000);

                    } else {
                        alert('Código inválido ou já utilizado!');
                    }
                });
            });
        }

        // Inicializa a verificação assim que a página carregar
        window.addEventListener('load', iniciarAplicativo);
    </script>
</body>
</html>
